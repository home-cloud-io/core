  names:
    kind: Disk
    listKind: DiskList
    plural: disks
    singular: disk
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.alias
      name: Alias
      type: string
    - jsonPath: .spec.node
      name: Node
      type: string
    - jsonPath: .spec.systemDisk
      name: System Disk
