    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.details.model
      name: Model
      type: string
    - jsonPath: .spec.details.devicePath
      name: Device Path
      type: string
    - jsonPath: .spec.details.mountPath
      name: Mount Path
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        description: Disk is the Schema for the apps API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              alias:
                description: A user-specified alias that can be used for display purposes
                type: string
              details:
                properties:
                  devicePath:
                    description: e.g. /dev/sda (keep in mind that this is *not* a
                      stable value)
                    type: string
                  model:
                    type: string
                  mountPath:
