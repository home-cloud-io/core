syntax = "proto3";

package platform.daemon.v1;

option go_package = "github.com/home-cloud-io/core/api/platform/daemon/v1";

import "google/protobuf/timestamp.proto";

message SystemStats {
  google.protobuf.Timestamp start_time = 1;
  google.protobuf.Timestamp end_time = 2;
  ComputeStats compute = 3;
  MemoryStats memory = 4;
  repeated DriveStats drives = 5;
}

message ComputeStats {
  float user_percent = 1;
  float system_percent = 2;
  float idle_percent = 3;
}

message MemoryStats {
  uint64 total_bytes = 1;
  uint64 used_bytes = 2;
  uint64 cached_bytes = 3;
  uint64 free_bytes = 4;
  uint64 available_bytes = 5;
}

message DriveStats {
  string mount_point = 1;
  uint64 total_bytes = 2;
  uint64 free_bytes = 3;
}

message ComponentVersion {
  string name = 1;
  string domain = 2;
  string version = 3;
}

message Log {
  string source = 1;
  string namespace = 2;
  string domain = 3;
  string log = 4;
  google.protobuf.Timestamp timestamp = 5;
}

message Disk {
  string name = 1;
  string device_path = 2;
  string model = 3;
  string serial = 4;
  string wwid = 5;
  string uuid = 6;
  DiskType type = 7;
  bool system_disk = 8;
  uint64 size = 9;
  repeated string symlinks = 10;
  string mount_path = 11;
}

enum DiskType {
  DEVICE_TYPE_UNSPECIFIED = 0;
  DEVICE_TYPE_SSD = 1;
  DEVICE_TYPE_HDD = 2;
  DEVICE_TYPE_NVME = 3;
}
